<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR 布局识别服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        h1 { color: #0066cc; font-size: 2.2em; }
        .nav-btn {
            background: transparent;
            color: #0066cc;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0066cc;
            transition: all 0.3s;
        }
        .nav-btn:hover { background: #0066cc; color: #fff; }
        .nav-btn.console { border-color: #e74c3c; color: #e74c3c; }
        .nav-btn.console:hover { background: #e74c3c; color: #fff; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; font-size: 1.1em; }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 50px 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #0066cc; background: rgba(0, 102, 204, 0.03); }
        .upload-area.dragover { border-color: #0066cc; background: rgba(0, 102, 204, 0.08); }
        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        .upload-text { color: #333; font-size: 1.1em; }
        .upload-hint { color: #888; font-size: 0.9em; margin-top: 10px; }
        #fileInput { display: none; }
        .preview-area { margin-top: 20px; text-align: center; display: none; }
        .preview-area.show { display: block; }
        .preview-img { max-width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .btn {
            display: inline-block;
            background: #0066cc;
            color: #fff;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        .btn:hover { background: #0052a3; transform: translateY(-2px); }
        .btn:disabled { background: #aaa; cursor: not-allowed; transform: none; }
        .btn-group { text-align: center; margin-top: 25px; display: flex; gap: 15px; justify-content: center; }
        .btn-view { background: #27ae60; }
        .btn-view:hover { background: #219a52; }
        .status { text-align: center; margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .status.show { display: block; }
        .status.loading { background: rgba(0, 102, 204, 0.1); color: #0066cc; }
        .status.success { background: rgba(39, 174, 96, 0.1); color: #27ae60; }
        .status.error { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .result-info { margin-top: 15px; font-size: 0.95em; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>OCR 布局识别</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/docs" class="nav-btn">API 文档</a>
                <a href="/console" class="nav-btn console">控制台</a>
            </div>
        </div>

        <p class="subtitle">基于 PaddleX + Ollama glm-ocr 的文档版面分析与文字识别</p>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击选择图片或拖拽图片到此处</div>
                <div class="upload-hint">支持 PNG、JPG、JPEG 格式</div>
            </div>
            <input type="file" id="fileInput" accept="image/*">

            <div class="preview-area" id="previewArea">
                <img id="previewImg" class="preview-img" src="" alt="预览">
                <div class="btn-group">
                    <button class="btn" id="ocrBtn" onclick="startOcr()">OCR识别</button>
                    <button class="btn" id="mdBtn" onclick="startMarkdown()" style="background: #4ecdc4;">Markdown识别</button>
                    <button class="btn" onclick="clearSelection()" style="background: #666;">清除</button>
                </div>
            </div>

            <div class="status" id="statusArea">
                <div id="statusText"></div>
                <div class="result-info" id="resultInfo"></div>
                <div class="btn-group" id="resultBtns" style="display: none; margin-top: 20px;">
                    <a href="#" id="viewLink" class="btn btn-view" target="_blank">查看结果</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg');
        const statusArea = document.getElementById('statusArea');
        const statusText = document.getElementById('statusText');
        const resultInfo = document.getElementById('resultInfo');
        const resultBtns = document.getElementById('resultBtns');
        const viewLink = document.getElementById('viewLink');
        const ocrBtn = document.getElementById('ocrBtn');
        const mdBtn = document.getElementById('mdBtn');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewArea.classList.add('show');
                statusArea.classList.remove('show');
                resultBtns.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function clearSelection() {
            selectedFile = null;
            fileInput.value = '';
            previewArea.classList.remove('show');
            statusArea.classList.remove('show');
            resultBtns.style.display = 'none';
        }

        async function startOcr() {
            if (!selectedFile) return;

            ocrBtn.disabled = true;
            ocrBtn.textContent = '识别中...';
            mdBtn.disabled = true;
            statusArea.className = 'status show loading';
            statusText.textContent = '正在版面识别，请稍候...';
            resultInfo.textContent = '';
            resultBtns.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.error) {
                    statusArea.className = 'status show error';
                    statusText.textContent = '识别失败: ' + data.error;
                } else {
                    statusArea.className = 'status show success';
                    statusText.textContent = 'OCR识别完成！';
                    resultInfo.innerHTML = `识别 ID: <strong>${data.id}</strong>`;
                    viewLink.href = '/viewer?id=' + data.id;
                    resultBtns.style.display = 'flex';
                }
            } catch (err) {
                statusArea.className = 'status show error';
                statusText.textContent = '请求失败: ' + err.message;
            } finally {
                ocrBtn.disabled = false;
                ocrBtn.textContent = 'OCR识别';
                mdBtn.disabled = false;
            }
        }

        async function startMarkdown() {
            if (!selectedFile) return;

            ocrBtn.disabled = true;
            mdBtn.disabled = true;
            mdBtn.textContent = '识别中...';
            statusArea.className = 'status show loading';
            statusText.textContent = '正在Markdown识别，请稍候...';
            resultInfo.textContent = '';
            resultBtns.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/markdown', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.error) {
                    statusArea.className = 'status show error';
                    statusText.textContent = '识别失败: ' + data.error;
                } else {
                    statusArea.className = 'status show success';
                    statusText.textContent = 'Markdown识别完成！';
                    resultInfo.innerHTML = `识别 ID: <strong>${data.id}</strong> | <a href="/viewer?id=${data.id}" class="btn btn-view" target="_blank">查看结果</a>`;
                    resultBtns.style.display = 'none';
                }
            } catch (err) {
                statusArea.className = 'status show error';
                statusText.textContent = '请求失败: ' + err.message;
            } finally {
                ocrBtn.disabled = false;
                mdBtn.disabled = false;
                mdBtn.textContent = 'Markdown识别';
            }
        }
    </script>
</body>
</html>
