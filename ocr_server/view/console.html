<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识别记录 - OCR 控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #0f3460;
        }
        h1 { color: #00d4ff; }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #00b4d8; }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info h3 { color: #fff; margin-bottom: 5px; }
        .info p { color: #888; font-size: 0.9em; }
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status.success { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; }
        .status.error { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .status.pending { background: rgba(199, 146, 234, 0.2); color: #c792ea; }
        .view-btn {
            background: #ffe66d;
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
        }
        .view-btn:hover { background: #ffd93d; }
        .empty { text-align: center; color: #888; padding: 60px; }
        .loading { text-align: center; color: #888; padding: 60px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>识别记录</h1>
        <a href="/" class="btn">返回首页</a>
    </div>

    <div id="records">
        <div class="loading">加载中...</div>
    </div>

    <script>
        async function loadRecords() {
            try {
                const res = await fetch('/list');
                const data = await res.json();
                const container = document.getElementById('records');

                if (!data.records || data.records.length === 0) {
                    container.innerHTML = '<div class="empty">暂无识别记录</div>';
                    return;
                }

                container.innerHTML = data.records.map(r => `
                    <div class="card">
                        <div class="info">
                            <h3>${r.image_name || '未知文件'}</h3>
                            <p>ID: ${r.id} | 时间: ${new Date(r.created_at).toLocaleString('zh-CN')}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span class="status ${r.status}">${r.status === 'success' ? '成功' : r.status === 'error' ? '失败' : '处理中'}</span>
                            <a href="/viewer?id=${r.id}" class="view-btn" target="_blank">查看详情</a>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('records').innerHTML = '<div class="empty">加载失败: ' + err + '</div>';
            }
        }

        loadRecords();
    </script>
</body>
</html>
